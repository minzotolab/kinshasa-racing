<style>
:root{--bleu:#1c64d6;--bleu2:#0b2f7a;--jaune:#ffd23a;--rouge:#e5383b;--nuit:#0a1226;--vert:#2fbf71}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1226;color:#fff;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;touch-action:none}
#view{position:fixed;inset:0}#view canvas{display:block;width:100%!important;height:100%!important}
.hidden{display:none!important}
.disp{font-family:Impact,"Arial Black","Segoe UI Black",sans-serif;letter-spacing:.02em;text-transform:uppercase}
/* ---------- écrans ---------- */
#screen,#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column}
#overlay{z-index:40;pointer-events:none}#overlay>*{pointer-events:auto}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(180deg,rgba(6,14,40,.85),rgba(6,14,40,0));flex-wrap:wrap}
.bar .sp{flex:1}
.chip{background:rgba(8,20,56,.78);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.chip b{color:var(--jaune)}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;color:#1a1200;font-weight:900;font-size:18px;text-transform:uppercase;padding:13px 26px;border-radius:14px;background:linear-gradient(180deg,#ffe36b,#ffb800);box-shadow:0 4px 0 #a86f00,0 8px 18px rgba(0,0,0,.35);letter-spacing:.03em;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a86f00}
.btn.blue{background:linear-gradient(180deg,#5aa0ff,#1c64d6);color:#fff;box-shadow:0 4px 0 #0b3a8e,0 8px 18px rgba(0,0,0,.35)}
.btn.red{background:linear-gradient(180deg,#ff7b7d,#e5383b);color:#fff;box-shadow:0 4px 0 #8f1417,0 8px 18px rgba(0,0,0,.35)}
.btn.ghost{background:rgba(8,20,56,.75);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.btn[disabled]{filter:grayscale(.9) brightness(.7);cursor:not-allowed}
.btn.small{font-size:14px;padding:8px 16px;border-radius:10px}
.panel{background:rgba(8,20,56,.82);border:1px solid rgba(255,255,255,.16);border-radius:18px;backdrop-filter:blur(6px);padding:16px}
.title-wrap{flex:1;display:flex;align-items:center;justify-content:space-between;padding:0 4vw 3vh;gap:2vw;min-height:0}
.logo{line-height:.9}
.logo .l1{font-size:min(11vw,92px);color:#fff;text-shadow:0 5px 0 #0b3a8e,0 10px 24px rgba(0,0,0,.5)}
.logo .l2{font-size:min(7.2vw,60px);color:var(--jaune);text-shadow:0 4px 0 #a02020,0 8px 18px rgba(0,0,0,.5)}
.logo .l3{margin-top:10px;font-weight:800;letter-spacing:.25em;font-size:min(3vw,15px);color:#cfe2ff;text-shadow:0 2px 6px #000}
.menu{display:flex;flex-direction:column;gap:12px;margin-top:22px;max-width:360px}
.flagbar{height:8px;border-radius:4px;background:linear-gradient(90deg,#1c64d6 0 40%,#ffd23a 40% 55%,#e5383b 55% 70%,#ffd23a 70% 85%,#1c64d6 85%);margin-top:12px;max-width:360px}
.hero{height:min(78vh,720px);filter:drop-shadow(0 14px 22px rgba(0,0,0,.55));object-fit:contain;max-width:44vw}
.heroName{position:absolute;right:5vw;bottom:2vh;text-align:right;pointer-events:none}
.heroName .n{font-size:min(6vw,44px);color:#fff;text-shadow:0 4px 0 #0b3a8e}
.heroName .t{color:var(--jaune);font-weight:800;text-shadow:0 2px 6px #000}
.scroll{overflow:auto;padding:6px 14px 20px;flex:1;min-height:0}
h2.sec{margin:6px 14px 0;font-size:30px;color:var(--jaune);text-shadow:0 3px 0 #000}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.card{position:relative;width:200px;border-radius:18px;padding:12px;background:linear-gradient(180deg,rgba(28,60,140,.9),rgba(8,20,56,.92));border:2px solid rgba(255,255,255,.18);cursor:pointer;transition:transform .12s,border-color .12s;text-align:center}
.card:hover{transform:translateY(-4px)}
.card.sel{border-color:var(--jaune);box-shadow:0 0 0 3px rgba(255,210,58,.35),0 10px 24px rgba(0,0,0,.45)}
.card.lock{opacity:.55;filter:grayscale(.7);cursor:not-allowed}
.card img{width:100%;height:230px;object-fit:contain}
.card .n{font-size:21px;color:#fff;margin:4px 0 0}.card .t{font-size:12px;color:var(--jaune);font-weight:800;margin-bottom:6px}
.stat{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin:3px 0;text-align:left}
.stat span{width:62px;color:#cfe2ff}.stat i{flex:1;height:8px;background:rgba(255,255,255,.14);border-radius:4px;overflow:hidden;display:block}
.stat i b{display:block;height:100%;background:linear-gradient(90deg,#ffd23a,#ff8a00)}
.badge{position:absolute;top:8px;right:8px;background:var(--vert);color:#fff;font-weight:900;font-size:12px;padding:3px 8px;border-radius:999px}
.badge.price{background:#222a44;color:var(--jaune);border:1px solid var(--jaune)}
.wide{width:min(94vw,520px);text-align:left}
.wide .n{font-size:24px}.wide p{margin:4px 0 8px;color:#d6e4ff;font-size:14px;line-height:1.35}
.stars{color:var(--jaune);letter-spacing:2px;font-size:18px}.stars .o{color:#4a557a}
.paints{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.paint{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.35);cursor:pointer}
.paint.sel{border-color:#fff;box-shadow:0 0 0 3px var(--jaune)}
.foot{display:flex;gap:10px;padding:10px 14px 14px;justify-content:center;flex-wrap:wrap}
.garage-side{position:absolute;right:12px;top:70px;width:min(92vw,340px);bottom:80px;overflow:auto}
.garage-list{display:flex;flex-direction:column;gap:8px}
.garage-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.06);border:2px solid transparent;cursor:pointer}
.garage-item.sel{border-color:var(--jaune);background:rgba(255,210,58,.12)}
.garage-item .n{font-weight:900}.garage-item .c{font-size:12px;color:#aac4ff}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;font-weight:800}
#hud .tl{position:absolute;left:12px;top:10px}
#h-pos{font-family:Impact,"Arial Black",sans-serif;font-size:min(14vw,76px);line-height:.85;text-shadow:0 4px 0 #0b3a8e,0 6px 14px #000}
#h-pos small{font-size:.45em;color:var(--jaune);margin-left:2px}#h-pos i{font-style:normal;font-size:.4em;color:#cfe2ff}
.hudtag{display:inline-block;background:rgba(8,20,56,.7);border-radius:8px;padding:3px 10px;margin:4px 4px 0 0;font-size:15px;border:1px solid rgba(255,255,255,.2)}
#h-board{margin-top:8px;display:flex;flex-direction:column;gap:3px}
.bd{display:flex;align-items:center;gap:6px;background:rgba(8,20,56,.62);border-radius:8px;padding:2px 8px 2px 3px;font-size:13px;min-width:130px;border-left:4px solid #fff}
.bd img{width:24px;height:24px;border-radius:50%;object-fit:cover;object-position:top;background:#1c3c8c}.bd.me{background:rgba(255,210,58,.9);color:#1a1200}.bd .p{width:16px;font-weight:900}
#hud .tr{position:absolute;right:12px;top:10px;text-align:right}
#h-map{width:min(34vw,170px);height:min(34vw,170px);border-radius:14px;border:2px solid rgba(255,255,255,.35);background:#222;margin-top:6px}
#hud .br{position:absolute;right:14px;bottom:12px;text-align:right}
#h-kmh{font-family:Impact,"Arial Black",sans-serif;font-size:min(13vw,72px);text-shadow:0 4px 0 #0b3a8e,0 6px 14px #000}#hud .br small{font-size:16px;color:var(--jaune);margin-left:4px}
.meter{width:min(46vw,230px);height:14px;border-radius:8px;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.4);overflow:hidden;margin-left:auto;margin-top:4px}
.meter b{display:block;height:100%;width:50%;background:linear-gradient(90deg,#2ee6ff,#3b82ff)}.meter.hp b{background:linear-gradient(90deg,#ff6a3d,#2fbf71)}
#h-msg{position:absolute;left:0;right:0;top:24%;text-align:center;font-family:Impact,"Arial Black",sans-serif;font-size:min(16vw,110px);text-shadow:0 6px 0 #0b3a8e,0 10px 24px #000;color:#fff}
#h-msg.sm{font-size:min(8vw,46px);top:18%}
#h-msg .pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(2.2);opacity:0}60%{transform:scale(.92);opacity:1}100%{transform:scale(1)}}
#h-obj{position:absolute;left:50%;transform:translateX(-50%);top:10px;width:min(62vw,520px);text-align:center}
#h-obj .t{background:rgba(8,20,56,.82);border:2px solid var(--jaune);border-radius:14px;padding:8px 14px;font-size:16px;line-height:1.25}
#h-obj .t b{color:var(--jaune)}
#h-obj .bar2{height:10px;margin-top:6px;border-radius:6px;background:rgba(0,0,0,.5);overflow:hidden}#h-obj .bar2 b{display:block;height:100%;width:0;background:var(--vert)}
#h-arrow{position:absolute;left:50%;top:150px;width:70px;height:70px;margin-left:-35px;text-align:center}
#h-arrow svg{width:56px;height:56px;filter:drop-shadow(0 3px 5px #000)}#h-arrow div{font-size:15px;text-shadow:0 2px 5px #000;margin-top:-4px}
#h-pause{pointer-events:auto;position:absolute;left:50%;margin-left:-22px;bottom:12px;width:44px;height:44px;border-radius:12px;border:2px solid #fff;background:rgba(8,20,56,.8);color:#fff;font-size:18px;cursor:pointer}
#labels{position:fixed;inset:0;z-index:9;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-100%);font-size:13px;font-weight:900;padding:2px 8px;border-radius:8px;background:rgba(8,20,56,.78);border:2px solid #fff;white-space:nowrap;text-shadow:0 1px 2px #000}
.lab.dst{background:var(--jaune);color:#1a1200;border-color:#fff;font-size:15px}
#toast{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);z-index:60;background:rgba(8,20,56,.92);border:2px solid var(--jaune);border-radius:14px;padding:10px 18px;font-weight:800;pointer-events:none;opacity:0;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
/* ---------- tactile ---------- */
#touch{position:fixed;inset:0;z-index:12;pointer-events:none}
#touch .tb{position:absolute;pointer-events:auto;width:84px;height:84px;border-radius:50%;background:rgba(8,20,56,.55);border:3px solid rgba(255,255,255,.55);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;font-weight:900}
#touch .tb.on{background:rgba(255,210,58,.7);color:#000}
#t-left{left:14px;bottom:26px}#t-right{left:112px;bottom:26px}#t-gas{right:14px;bottom:26px;width:100px;height:100px;background:rgba(47,191,113,.55)}#t-brake{right:124px;bottom:20px;width:70px;height:70px;font-size:20px}#t-nitro{right:30px;bottom:140px;width:70px;height:70px;font-size:18px;background:rgba(46,230,255,.5)}
/* ---------- overlays ---------- */
.modal{margin:auto;width:min(94vw,560px);max-height:92vh;overflow:auto}
.modal h3{margin:0 0 8px;font-size:34px;color:var(--jaune);text-shadow:0 3px 0 #000}
.res{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.rr{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:12px;padding:6px 10px;font-weight:800}
.rr.me{background:rgba(255,210,58,.9);color:#1a1200}.rr .p{font-family:Impact,sans-serif;font-size:26px;width:46px}.rr img{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:top;background:#1c3c8c}.rr .s{flex:1}.rr .tm{font-size:14px}
.reward{display:flex;gap:10px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.q{font-size:18px;line-height:1.35;margin:6px 0 12px}.ans{display:block;width:100%;text-align:left;margin:8px 0;font-size:16px;text-transform:none}
.host{display:flex;gap:12px;align-items:center}.host .av{width:64px;height:64px;border-radius:50%;background:linear-gradient(180deg,#5aa0ff,#0b2f7a);display:flex;align-items:center;justify-content:center;font-size:34px;flex:none}
#concert{position:fixed;inset:0;z-index:30;background:#05081a}#concert canvas{display:block;margin:0 auto;height:100%;max-width:100%}
#loading{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#1c64d6,#0a1226);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#loading .l1{font-size:min(12vw,80px)}#loading .bar3{width:min(70vw,360px);height:12px;border-radius:8px;background:rgba(255,255,255,.2);overflow:hidden}#loading .bar3 b{display:block;height:100%;width:0;background:var(--jaune);transition:width .2s}
@media (max-width:760px){.hero{max-width:60vw;height:50vh;position:absolute;right:-6vw;bottom:0;opacity:.95}.title-wrap{align-items:flex-start;padding-top:2vh}.heroName{display:none}.garage-side{top:auto;bottom:84px;height:44vh}}
@media (orientation:portrait){.hero{max-width:70vw;height:46vh;right:-8vw}}

/* --- Mode paysage obligatoire sur téléphone --- */
#rotate{display:none;position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at 50% 40%,#12306e,#060d20);color:#fff;text-align:center;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#rotate .ph{font-size:84px;animation:rot 1.8s ease-in-out infinite}
#rotate .rt{font-size:28px;font-weight:900;margin-top:14px;color:#ffd23a}
#rotate .rs{font-size:16px;margin-top:8px;opacity:.85;max-width:300px}
#rotate button{margin-top:22px;padding:12px 22px;border-radius:12px;border:0;background:#ffd23a;font-weight:900;font-size:16px}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}

/* --- Téléphone en paysage (écran bas) --- */
@media (orientation:landscape) and (max-height:520px){
 .logo .l1{font-size:min(8vw,44px)}.logo .l2{font-size:min(5vw,30px)}
 .title-wrap{padding:0 3vw 2vh;align-items:center}
 .menu{gap:7px;margin-top:10px;max-width:300px}
 .btn{font-size:14px;padding:8px 16px;border-radius:11px}
 .hero{height:70vh;max-width:36vw;right:2vw;position:absolute;bottom:0}
 .heroName .n{font-size:26px}.heroName .t{font-size:11px}
 .card:not(.wide){width:128px;padding:8px}.card img{height:130px}.card:not(.wide) .n{font-size:15px}
 .card.wide{width:auto;padding:8px 12px;font-size:12px}
 #h-pos{font-size:44px}.hudtag{font-size:11px;padding:2px 7px;margin:2px 3px 0 0}
 #h-board{margin-top:4px;gap:2px;transform:scale(.72);transform-origin:left top}
 #hud .tl{left:8px;top:6px}#hud .tr{right:8px;top:6px}
 #h-map{width:92px;height:92px;margin-top:3px}
 #hud .br{right:auto;left:50%;transform:translateX(-50%);bottom:6px;text-align:center}
 #h-kmh{font-size:40px}#hud .br small{font-size:12px}
 .meter{width:150px;height:10px;margin:3px auto 0}
 #h-msg{font-size:56px;top:18%}#h-msg.sm{font-size:28px;top:14%}
 #h-wrong{font-size:20px!important;top:30%!important}
 #h-obj{top:6px;width:min(50vw,420px)}#h-obj .t{font-size:12px;padding:5px 10px}
 #touch .tb{width:66px;height:66px;font-size:24px}
 #t-left{left:12px;bottom:14px}#t-right{left:90px;bottom:14px}
 #t-gas{right:12px;bottom:14px;width:78px;height:78px}
 #t-brake{right:100px;bottom:12px;width:58px;height:58px;font-size:14px}
 #t-nitro{right:22px;bottom:100px;width:56px;height:56px;font-size:13px}
 #h-pause{left:auto;margin-left:0;right:8px;top:132px;bottom:auto;width:36px;height:36px;font-size:14px}
}

</style>
</head>

<div id="view"></div>
<div id="labels"></div>

<div id="hud" class="hidden">
  <div class="tl">
    <div id="h-pos"><span id="h-posn">1</span><small id="h-pose">er</small><i>/5</i></div>
    <div><span class="hudtag" id="h-lap">TOUR 1/3</span><span class="hudtag" id="h-time">00:00.00</span></div>
    <div><span class="hudtag" id="h-lapt" style="font-size:12px"></span></div>
    <div id="h-board"></div>
  </div>
  <div id="h-obj" class="hidden"><div class="t"></div><div class="bar2"><b id="h-objb"></b></div></div>
  <div id="h-arrow" class="hidden"><svg viewBox="0 0 64 64"><path d="M32 4 L58 52 L32 40 L6 52 Z" fill="#ffd23a" stroke="#000" stroke-width="4" stroke-linejoin="round"/></svg><div></div></div>
  <div class="tr">
    <span class="hudtag" id="h-coins">🪙 <b id="h-coinsn">0</b></span><br>
    <canvas id="h-map" width="170" height="170"></canvas>
  </div>
  <div class="br">
    <div><span id="h-kmh">0</span><small>km/h</small></div>
    <div class="meter"><b id="h-nf"></b></div>
    <div id="h-hp" class="meter hp hidden" title="État de la voiture"><b id="h-hpf" style="width:100%"></b></div>
    <span id="h-timer"></span>
  </div>
  <div id="h-wrong" class="hidden" style="position:absolute;left:0;right:0;top:40%;text-align:center;font-size:min(8vw,44px);color:#ff5d5d;text-shadow:0 3px 0 #000" >⚠ SENS INTERDIT — fais demi-tour !</div>
  <div id="h-msg"></div>
  <button id="h-pause" title="Pause">❚❚</button>
</div>

<div id="touch" class="hidden">
  <div class="tb" id="t-left">◀</div><div class="tb" id="t-right">▶</div>
  <div class="tb" id="t-brake">FREIN</div><div class="tb" id="t-gas">GAZ</div><div class="tb" id="t-nitro">NITRO</div>
</div>

<div id="screen" class="hidden"></div>
<div id="concert" class="hidden"></div>
<div id="overlay"></div>
<div id="toast"></div>
<div id="rotate"><div class="ph">📱</div><div class="rt">Tourne ton téléphone</div><div class="rs">Kinshasa Racing se joue en mode paysage (à l'horizontale)</div><button id="rotfs">Plein écran</button></div>

<div id="loading"><div class="disp l1" style="color:#fff;text-shadow:0 5px 0 #0b3a8e">Kinshasa Racing</div><div class="bar3"><b style="width:100%"></b></div><div style="font-weight:700;color:#cfe2ff">Chargement de la ville…</div></div>
